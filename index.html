<style>

function taskStatus(k){if(!k)return'todo';if(k.done||k.status==='done')return'done';return TASK_STATUS[k.status]?k.status:'todo';}
function taskStatusLabel(k){return TASK_STATUS[taskStatus(k)].label;}
function applyTaskStatus(k,status,opts){if(!k||!TASK_STATUS[status])return false;opts=opts||{};const old=taskStatus(k),g=goalForRef(k.id),sk='task:'+k.id+':done';if(old===status){k.done=status==='done';return false;}if(status==='done'){k.preDoneStatus=old==='done'?(k.preDoneStatus||'todo'):old;k.status='done';k.done=true;k.doneAt=k.doneAt||todayMD();removeFromPlans(k.id);if(!opts.silent){logEvent('task_done',{goalId:g&&g.id,refId:k.id,title:k.title,sourceKey:sk});celebrate();}}else{k.status=status;k.done=false;if(old==='done'){k.doneAt=null;reverseProgress(sk);if(!opts.silent)logEvent('item_reopened',{goalId:g&&g.id,refId:k.id,title:k.title,meta:{status}});}else if(!opts.silent)logEvent('task_status',{goalId:g&&g.id,refId:k.id,title:k.title,meta:{from:old,to:status}});}return true;}
function setTaskStatus(id,status){const k=findRef(id);if(!k||!goalForRef(id)?.tasks.includes(k)||!TASK_STATUS[status])return;captureUndo('更改任務狀態');const changed=applyTaskStatus(k,status);render();if(changed)toast('任務已設為「'+TASK_STATUS[status].label+'」',true);}
function taskFraction(k){const tg=Math.max(1,k.target||1);return taskStatus(k)==='done'?1:Math.min(1,(k.count||0)/tg);}
function milestoneTasks(g,m){return (g.tasks||[]).filter(k=>k.pid&&k.mid===m.id);}
function milestoneFraction(g,m){const a=milestoneTasks(g,m);return a.length?a.reduce((n,k)=>n+taskFraction(k),0)/a.length:(m.done?1:0);}
function goalLeaves(g){let d=0,t=0;const nested=new Set();(g.projects||[]).forEach(p=>(p.milestones||[]).forEach(m=>{t++;d+=milestoneFraction(g,m);milestoneTasks(g,m).forEach(k=>nested.add(k.id));}));(g.tasks||[]).forEach(k=>{if(!nested.has(k.id)){t++;d+=taskFraction(k);}});return{d,t};}
function repairTaskRelations(){(state.goals||[]).forEach(g=>{g.projects=g.projects||[];g.tasks=g.tasks||[];g.projects.forEach(p=>p.milestones=p.milestones||[]);g.tasks.forEach(k=>{const p=k.pid&&g.projects.find(p=>p.id===k.pid);const m=p&&k.mid&&p.milestones.find(m=>m.id===k.mid);if(!p||!m){k.pid=null;k.mid=null;}});});}
function syncDerivedMilestones(emit){(state.goals||[]).forEach(g=>(g.projects||[]).forEach(p=>(p.milestones||[]).forEach(m=>{const a=milestoneTasks(g,m);if(!a.length)return;const next=a.every(k=>k.done);const prev=!!m.done;m.done=next;m.doneAt=next?(m.doneAt||todayMD()):null;if(emit&&prev!==next){const sk='milestone:'+m.id+':done';if(next)logEvent('milestone_done',{goalId:g.id,refId:m.id,title:m.title,sourceKey:sk});else{reverseProgress(sk);logEvent('item_reopened',{goalId:g.id,refId:m.id,title:m.title});}}})));}
function goalPct(g){const{d,t}=goalLeaves(g);return t?Math.round(d/t*100):0;}
function goalRhythm(g){let d=0,t=0;(g.routines||[]).forEach(r=>{d+=hDoneWk(r);t+=hTargetWk(r);});return{d,t};}
function filtGoals(){return state.goals.filter(g=>(g.status||'active')==='active');}

function backlogCount(){let n=0;state.goals.forEach(g=>g.routines.forEach(r=>{if(r.overdue)n++;}));return n;}

function hTargetWk(x){if(x&&typeof x==='object'){const t=new Date(),ws=state.settings.weekStart==='sun'?0:1,back=(t.getDay()-ws+7)%7,a=new Date(t);a.setHours(12,0,0,0);a.setDate(a.getDate()-back);let n=0;for(let i=0;i<7;i++){const d=new Date(a);d.setDate(a.getDate()+i);if(habitDueOn(x,d))n++;}return n;}const rec=recFromCad(x);if(rec.freq==='day')return Math.max(1,Math.round(7/(rec.interval||1)));if(rec.freq==='week')return (rec.wdays&&rec.wdays.length)||1;return 1;}
function habitDates(r){r.completionDates=Array.isArray(r.completionDates)?r.completionDates:[];return r.completionDates;}
function hDoneWk(r){const wk=isoWeekKey();return Math.min(hTargetWk(r),habitDates(r).filter(d=>isoWeekKey(dueDate(d))===wk).length);}
function weekHabit(){let d=0,t=0;state.goals.forEach(g=>g.routines.forEach(r=>{t+=hTargetWk(r);d+=hDoneWk(r);}));return{d,t};}
function overallPct(){let d=0,t=0;state.goals.forEach(g=>{const l=goalLeaves(g);d+=l.d;t+=l.t;});return t?Math.round(d/t*100):0;}

const CURRENT_SCHEMA=8;
function migrateSchema7(){

  state.sessions=Array.isArray(state.sessions)?state.sessions:[];

  });

}
function migrateSchema8(){(state.goals||[]).forEach(g=>(g.tasks||[]).forEach(k=>{if(!TASK_STATUS[k.status])k.status=k.done?'done':'todo';if(k.done){k.status='done';if(!TASK_STATUS[k.preDoneStatus]||k.preDoneStatus==='done')k.preDoneStatus='todo';}else if(k.status==='done')k.status='todo';}));}
function runMigrations(){const before=JSON.stringify(state);try{if((state.schemaVersion||0)<1){state._dateSchema=state._dateSchema||0;migrateDates();state.schemaVersion=1;}if(state.schemaVersion<2){state.sessions=state.sessions||[];state.sessions.forEach(x=>{if(x.done===undefined)x.done=false;if(x.doneAt===undefined)x.doneAt=null;});state.settings.availability=state.settings.availability||null;state.schemaVersion=2;}if(state.schemaVersion<3){state.events=state.events||[];state.goals.forEach(g=>{if(!g.status)g.status='active';});state.schemaVersion=3;}if(state.schemaVersion<4){state.blockExceptions=state.blockExceptions||[];state.externalEvents=state.externalEvents||[];state.settings.showExternalCalendar=state.settings.showExternalCalendar!==false;state.schemaVersion=4;}if(state.schemaVersion<5){state.goals.forEach(g=>{if(g.status==='waiting')g.status='paused';g.tasks.forEach(k=>{delete k.recur;if(k.target===undefined)k.target=1;if(k.count===undefined)k.count=0;});g.projects.forEach(p=>p.milestones.forEach(m=>{delete m.waiting;delete m.subtasks;}));});state.schemaVersion=5;}if((state.schemaVersion||0)<6){state.goals.forEach(g=>{(g.tasks||[]).forEach(k=>{if(k.pid)k.pid=null;if(k.mid===undefined)k.mid=null;});});state.schemaVersion=6;}if((state.schemaVersion||0)<7){migrateSchema7();state.schemaVersion=7;}if((state.schemaVersion||0)<8){migrateSchema8();state.schemaVersion=8;}localStorage.setItem('ght_pre_migration_backup_blank',before);}catch(e){const old=JSON.parse(before);for(const k in state)delete state[k];Object.assign(state,old);console.error('MIGRATION '+e.message);}}

function gripDown(e,dk,di){if(e.stopPropagation)e.stopPropagation();PDRAG={dk:dk,di:di};try{const el=e.currentTarget;if(el&&el.setPointerCapture)el.setPointerCapture(e.pointerId);}catch(_){}const row=(e.currentTarget&&e.currentTarget.closest)?e.currentTarget.closest('[data-dk]'):null;if(row)row.classList.add('dragging');}

function ensureDailyPlans(){state.dailyPlans=state.dailyPlans||{};const key=todayMD();if(!state.dailyPlans[key])state.dailyPlans[key]={itemIds:[],order:[]};if((state.todayPins||[]).length){state.todayPins.forEach(id=>{if(!state.dailyPlans[key].itemIds.includes(id))state.dailyPlans[key].itemIds.push(id);});state.todayPins=[];}if((state.todayOrder||[]).length&&!state.dailyPlans[key].order.length){state.dailyPlans[key].order=state.todayOrder.slice();state.todayOrder=[];}return state.dailyPlans;}

function minutesOf(t){if(!t)return 0;const p=t.split(':').map(Number);return p[0]*60+(p[1]||0);}
function timeBlocksFor(iso){const out=[];(state.timeBlocks||[]).forEach(b=>{if(!blockApplies(b,iso))return;const ex=(state.blockExceptions||[]).find(x=>x.blockId===b.id&&x.date===iso);if(ex&&ex.action==='skip')return;out.push(ex&&ex.action==='override'?{...b,title:ex.title||b.title,start:ex.start||b.start,end:ex.end||b.end,exception:true}:b);});return out;}
function sessionsFor(iso){return(state.sessions||[]).filter(x=>x.date===iso);}
function habitExceptionFor(id,iso){return(state.habitScheduleExceptions||[]).find(x=>x.habitId===id&&x.date===iso);}
function habitScheduleFor(iso){const out=[];(state.goals||[]).filter(g=>(g.status||'active')==='active').forEach(g=>(g.routines||[]).forEach(r=>{if(!habitDueOn(r,dueDate(iso)))return;const ex=habitExceptionFor(r.id,iso);if(ex&&ex.action==='skip')return;const ds=r.defaultSchedule||null,start=ex&&ex.startTime||ds&&ds.startTime,minutes=+(ex&&ex.durationMinutes||ds&&ds.durationMinutes||r.estimateMinutes||0);if(!start||!minutes)return;out.push({kind:'habit',id:'habit:'+r.id+':'+iso,habitId:r.id,taskId:r.id,title:r.title,start,end:'',minutes,done:habitDates(r).includes(iso),color:gColor(g),goal:g.title});}));return out;}
function availabilityFor(iso){const d=dueDate(iso)||new Date(),wd=d.getDay(),all=state.settings.availability||{},v=all[wd]||all[String(wd)]||{enabled:true,start:wd===0||wd===6?'09:00':'08:00',end:'22:00'};return{enabled:v.enabled!==false,start:v.start||'08:00',end:v.end||'22:00'};}
function effortFor(ref){const ss=(state.sessions||[]).filter(x=>x.taskId===ref.id),raw=ref.estimateMinutes!==undefined?ref.estimateMinutes:ref.estimate,total=raw==null||raw===''?null:+raw,scheduled=ss.reduce((n,x)=>n+(+x.minutes||0),0),completed=ss.filter(x=>x.done).reduce((n,x)=>n+(+x.minutes||0),0),remaining=total==null?null:Math.max(0,total-completed);return{total,scheduled,completed,remaining,pct:total?Math.min(100,Math.round(completed/total*100)):0};}
function ensureSchedulePrefs(){if(!state.settings.scheduling)state.settings.scheduling={maxFocus:240,maxSession:120,breakMinutes:15};return state.settings.scheduling;}
function focusMinutesFor(iso,ignore){return scheduledFor(iso).filter(x=>(x.kind==='session'||x.kind==='habit')&&x.id!==ignore&&!x.done).reduce((n,x)=>n+(x.minutes||0),0);}
function unscheduledEffort(ref){const ef=effortFor(ref);if(ef.remaining==null)return null;const future=(state.sessions||[]).filter(x=>x.taskId===ref.id&&!x.done&&tdue(x.date)>=TNUM()).reduce((n,x)=>n+(x.minutes||0),0);return Math.max(0,ef.remaining-future);}
function freeSlotsFor(iso){const av=availabilityFor(iso);if(!av.enabled)return[];const pref=ensureSchedulePrefs(),lo=minutesOf(av.start),hi=minutesOf(av.end),ints=scheduledFor(iso).map(x=>{let a=minutesOf(x.start),b=x.end?minutesOf(x.end):a+x.minutes;if(x.kind==='session'||x.kind==='task')b+=pref.breakMinutes;return[Math.max(lo,a),Math.min(hi,b)]}).filter(x=>x[1]>x[0]).sort((a,b)=>a[0]-b[0]),merged=[];ints.forEach(x=>{const last=merged[merged.length-1];if(last&&x[0]<=last[1])last[1]=Math.max(last[1],x[1]);else merged.push(x.slice())});let cur=lo,out=[];merged.forEach(x=>{if(x[0]-cur>=30)out.push({date:iso,start:clock24(cur),minutes:x[0]-cur});cur=Math.max(cur,x[1]);});if(hi-cur>=30)out.push({date:iso,start:clock24(cur),minutes:hi-cur});let remain=Math.max(0,pref.maxFocus-focusMinutesFor(iso));return out.map(x=>{const m=Math.min(x.minutes,remain);remain-=m;return{...x,minutes:m}}).filter(x=>x.minutes>=30);}
function autoCandidates(){const a=[];state.goals.filter(g=>(g.status||'active')==='active').forEach(g=>{g.tasks.forEach(x=>{const u=unscheduledEffort(x);if(!x.done&&u!=null&&u>0)a.push({ref:x,g,kind:'task'});});});return a.sort((x,y)=>(y.g.focus?1:0)-(x.g.focus?1:0)||(tdue(x.ref.due)||99999999)-(tdue(y.ref.due)||99999999));}
function generateAutoPlan(){const pref=ensureSchedulePrefs(),slots=[];for(let i=0;i<7;i++)freeSlotsFor(dateAdd(todayMD(),i)).forEach(x=>slots.push(x));const suggestions=[];for(const c of autoCandidates()){let need=unscheduledEffort(c.ref);for(const sl of slots){if(need<15||sl.minutes<30)continue;const m=Math.min(need,sl.minutes,pref.maxSession);suggestions.push({id:uid(),taskId:c.ref.id,title:c.ref.title,goal:c.g.title,date:sl.date,start:sl.start,minutes:m,selected:true,reason:c.g.focus?'焦點目標':'接近期限'});sl.start=clock24(minutesOf(sl.start)+m+pref.breakMinutes);sl.minutes-=m+pref.breakMinutes;need-=m;if(suggestions.length>=12)break;}if(suggestions.length>=12)break;}state.autoPlanSuggestions=suggestions;showAutoPlan();}
function toggleAutoSuggestion(id){const x=(state.autoPlanSuggestions||[]).find(x=>x.id===id);if(x)x.selected=!x.selected;showAutoPlan();}
function showAutoPlan(){const a=state.autoPlanSuggestions||[],root=document.getElementById('modalRoot');root.innerHTML=`<div class="mask"><div class="modal"><h3>智慧安排建議</h3><div class="note">按焦點、期限、剩餘工時、可用時間及休息間隔產生；套用前可以取消個別建議。</div><div class="autolist">${a.map(x=>`<button class="${x.selected?'on':''}" onclick="toggleAutoSuggestion('${x.id}')"><i>${x.selected?'✓':'○'}</i><span><b>${esc(x.title)}</b><em>${fmtDate(x.date)} · ${x.start} · ${durLabel(x.minutes)} · ${x.reason}</em></span></button>`).join('')||'<div class="empty">未搵到合適空閒時段</div>'}</div><div class="mbtns"><button class="cancel" onclick="closeModal()">取消</button><button class="save" ${a.some(x=>x.selected)?'':'disabled'} onclick="applyAutoPlan()">套用安排</button></div></div></div>`;}

function sessionWarnings(p,ignore){const pref=ensureSchedulePrefs(),c=scheduleConflicts(p.date,p.start,p.minutes,ignore),focus=focusMinutesFor(p.date,ignore);if(p.minutes>pref.maxSession)c.push({title:'超過單次專注時段上限',start:durLabel(p.minutes),end:'上限 '+durLabel(pref.maxSession),kind:'limit'});if(focus+p.minutes>pref.maxFocus)c.push({title:'超過每日專注上限',start:durLabel(focus+p.minutes),end:'上限 '+durLabel(pref.maxFocus),kind:'limit'});return c;}
function scheduledFor(iso){const out=[];externalEventsFor(iso).forEach(e=>{const st=String(e.start).slice(11,16)||'09:00',en=String(e.end).slice(11,16)||clock24(minutesOf(st)+60);out.push({kind:'external',id:e.id,title:e.title||'外部行程',start:st,end:en,minutes:Math.max(0,minutesOf(en)-minutesOf(st)),readOnly:true,source:e.source||'calendar'});});timeBlocksFor(iso).forEach(b=>out.push({kind:'block',id:b.id,title:b.title,start:b.start,end:b.end,minutes:Math.max(0,minutesOf(b.end)-minutesOf(b.start)),repeat:b.repeat}));sessionsFor(iso).forEach(x=>{const r=findRef(x.taskId);if(r)out.push({kind:'session',id:x.id,taskId:x.taskId,title:r.title,start:x.start,end:'',minutes:x.minutes||60,done:!!x.done,doneAt:x.doneAt,needsReview:!!x.needsReview});});habitScheduleFor(iso).forEach(x=>out.push(x));return out.sort((a,b)=>(a.start||'99').localeCompare(b.start||'99'));}
function mergeMinutes(ints){const a=ints.filter(x=>x[1]>x[0]).sort((x,y)=>x[0]-y[0]);if(!a.length)return 0;let s=a[0][0],e=a[0][1],n=0;for(let i=1;i<a.length;i++){if(a[i][0]<=e)e=Math.max(e,a[i][1]);else{n+=e-s;s=a[i][0];e=a[i][1];}}return n+e-s;}
function scheduleStats(iso){const a=scheduledFor(iso),av=availabilityFor(iso),lo=minutesOf(av.start),hi=minutesOf(av.end),window=av.enabled?Math.max(0,hi-lo):0,intervals=a.map(x=>{const st=minutesOf(x.start),en=x.end?minutesOf(x.end):st+x.minutes;return[Math.max(lo,st),Math.min(hi,en)]}),occupied=av.enabled?mergeMinutes(intervals):0,blocked=a.filter(x=>x.kind==='block').reduce((n,x)=>n+x.minutes,0),tasks=a.filter(x=>x.kind!=='block').reduce((n,x)=>n+x.minutes,0),free=Math.max(0,window-occupied);return{items:a,blocked,tasks,free,total:occupied,window,availability:av};}
function overlap(a,b,c,d){return a<d&&c<b;}
function thirdOverlapInfo(date,start,mins,ignore){const st=minutesOf(start),en=st+(+mins||0),hits=scheduledFor(date).filter(x=>!(ignore&&x.id===ignore)).map(x=>({...x,_s:minutesOf(x.start),_e:x.end?minutesOf(x.end):minutesOf(x.start)+(x.minutes||60)})).filter(x=>overlap(st,en,x._s,x._e));for(let i=0;i<hits.length;i++)for(let j=i+1;j<hits.length;j++)if(Math.max(st,hits[i]._s,hits[j]._s)<Math.min(en,hits[i]._e,hits[j]._e))return[hits[i],hits[j]];return[];}
function showThirdOverlap(items){const root=document.getElementById('modalRoot'),rows=(items||[]).map(x=>`<div class="confrow"><b>${esc(x.title)}</b><span>${x.start}–${scheduleItemEnd(x)}</span></div>`).join('');root.innerHTML=`<div class="mask"><div class="modal"><h3>此時段已有兩個安排</h3><div class="note">為保持時間線清晰，手動安排最多同時兩項。請先調整其中一項。</div><div class="conflicts">${rows}</div><div class="mbtns"><button class="save" onclick="closeModal()">知道了</button></div></div></div>`;}
function timelineConflictGroups(items){const points=[...new Set(items.flatMap(x=>[x._s,x._e]))].sort((a,b)=>a-b),groups=[];for(let i=0;i<points.length-1;i++){const a=points[i],b=points[i+1],active=items.filter(x=>x._s<b&&a<x._e);if(active.length<3)continue;const ids=new Set(active.map(x=>x.id)),last=groups[groups.length-1];if(last&&a<=last.end&&active.some(x=>last.ids.has(x.id))){last.end=Math.max(last.end,b);ids.forEach(id=>last.ids.add(id));}else groups.push({start:a,end:b,ids});}groups.forEach((g,i)=>items.filter(x=>g.ids.has(x.id)).forEach(x=>x._group=i));return groups;}

function scheduleConflicts(date,start,mins,ignore){const st=minutesOf(start),en=st+(+mins||0),out=[],buf=ensureSchedulePrefs().breakMinutes;scheduledFor(date).forEach(x=>{if(ignore&&x.id===ignore)return;const xs=minutesOf(x.start),xe=x.end?minutesOf(x.end):xs+x.minutes,isWork=x.kind==='session'||x.kind==='task',hit=isWork?(st<xe+buf&&xs<en+buf):overlap(st,en,xs,xe);if(hit)out.push({title:x.title+(isWork&& !overlap(st,en,xs,xe)?' · 需要休息間隔':''),start:x.start,end:x.end||clock24(xe),kind:x.kind});});return out;}
function clock24(min){min=Math.max(0,Math.min(1439,Math.round(min)));return pad2(Math.floor(min/60))+':'+pad2(min%60);}
function blockApplies(b,iso){if((b.startsOn&&iso<b.startsOn)||(b.endsOn&&iso>b.endsOn))return false;const d=dueDate(iso),wd=d.getDay();return b.repeat==='daily'||(b.repeat==='weekdays'&&wd>=1&&wd<=5)||(b.repeat==='weekly'&&b.wday===wd)||(b.repeat==='once'&&b.date===iso);}
function blockConflicts(b,ignore){const out=[];for(let i=0;i<8;i++){const iso=dateAdd(todayMD(),i);if(!blockApplies(b,iso))continue;const c=scheduleConflicts(iso,b.start,minutesOf(b.end)-minutesOf(b.start),ignore);c.forEach(x=>out.push({...x,date:iso}));}return out.slice(0,5);}
let PENDING_SCHEDULE=null;

function afSync(){const m={afname:'name',afgoal:'gid',afproject:'pid',afkind:'kind',afvision:'vision',afremind:'remind',aftime:'time',afestimate:'estimate',aftarget:'target'};for(const id in m){const el=document.getElementById(id);if(el)af[m[id]]=el.isContentEditable?editorTitleText(el):el.value;}}

function condOptions(fi){if(fi===0)return['—'];if(fi===3){let a=[];for(let d=1;d<=31;d++)a.push(d+' 號');return a;}return WD.map(w=>'星期'+w);}
function wheelHTML(id,opts,sel){return `<div class="wheel" id="${id}" data-no-page-swipe><div class="pad"></div>${opts.map((o,i)=>`<button type="button" class="wi ${i===sel?'sel':''}" onclick="wheelChoose('${id}',${i})">${o}</button>`).join('')}<div class="pad"></div></div>`;}
function wheelChoose(id,idx){const el=document.getElementById(id);if(!el)return;const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;el.scrollTo({top:idx*38,behavior:reduce?'auto':'smooth'});clearTimeout(el._wheelClickTimer);el._wheelClickTimer=setTimeout(()=>el._wheelCommit&&el._wheelCommit(idx),reduce?20:180);}function initWheel(id,count,sel,onSel){const el=document.getElementById(id);if(!el)return;const itemH=38,clamp=n=>Math.max(0,Math.min(count-1,n)),indexNow=()=>clamp(Math.round(el.scrollTop/itemH));let to,frame=0,ignore=true,last=clamp(sel);const paint=idx=>{el.querySelectorAll('.wi').forEach((w,i)=>w.classList.toggle('sel',i===idx));};const commit=idx=>{idx=clamp(idx);paint(idx);if(idx===last)return;last=idx;onSel(idx);if(navigator.vibrate)try{navigator.vibrate(4)}catch(_){}};el._wheelCommit=commit;el.onscroll=()=>{if(ignore)return;if(!frame)frame=requestAnimationFrame(()=>{frame=0;if(el.isConnected)paint(indexNow());});clearTimeout(to);to=setTimeout(()=>{if(el.isConnected)commit(indexNow());},70);};if('onscrollend'in el)el.onscrollend=()=>{clearTimeout(to);commit(indexNow());};requestAnimationFrame(()=>{if(!el.isConnected)return;el.scrollTop=last*itemH;paint(last);requestAnimationFrame(()=>{ignore=false;});});}
function miniCalHTML(y,m,sel,pickFn,navFn){const lead=(new Date(y,m,1).getDay()+6)%7;const days=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<lead;i++)cells+='<div class="cd muted"></div>';for(let d=1;d<=days;d++){const isSel=(sel&&sel.d===d&&sel.m===m&&sel.y===y);const now=new Date(),isToday=(y===now.getFullYear()&&m===now.getMonth()&&d===now.getDate());cells+=`<div class="cd pick ${isSel?'sel':(isToday?'todayr':'')}" onclick="${pickFn}(${y},${m},${d})">${d}</div>`;}return `<div class="cal"><div class="mininav"><button onclick="${navFn}(-1)">‹</button><span class="mt">${y}年 ${m+1}月</span><button onclick="${navFn}(1)">›</button></div><div class="cg"><div class="wd">一</div><div class="wd">二</div><div class="wd">三</div><div class="wd">四</div><div class="wd">五</div><div class="wd">六</div><div class="wd">日</div>${cells}</div></div>`;}

function projectSelHTML(){const g=state.goals.find(x=>x.id===af.gid);if(!g||!g.projects||!g.projects.length)return '';return `<div class="fld"><label>歸入專案（選填）</label><select id="afproject" onchange="afSync();af.pid=this.value||null;af.mid=null;renderAddModal()"><option value="" ${!af.pid?'selected':''}>（無專案 · 零散任務）</option>${g.projects.map(p=>`<option value="${p.id}" ${p.id===af.pid?'selected':''}>${esc(p.title)}</option>`).join('')}</select></div>`;}
function phaseSelHTML(){const g=state.goals.find(x=>x.id===af.gid);if(!g||!af.pid)return '';const p=g.projects.find(x=>x.id===af.pid);if(!p)return '';const mils=p.milestones||[];if(af.newPhase||!mils.length){return `<div class="fld"><label>新增階段</label><div class="estcustom"><input id="afnewphase" value="${esc(af.newPhaseName||'')}" oninput="af.newPhaseName=this.value" placeholder="例：場地確認"><button type="button" class="addbtn" onclick="afCreatePhase()">建立</button></div>${mils.length?`<button type="button" class="linkbtn" onclick="afSync();af.newPhase=false;renderAddModal()">‹ 選擇現有階段</button>`:`<div class="fieldhelp">此專案尚無階段，先建立一個階段再加入任務。</div>`}</div>`;}return `<div class="fld"><label>歸入階段</label><select id="afphase" onchange="afPickPhase(this.value)"><option value="" ${!af.mid?'selected':''}>請選擇階段</option>${mils.map(m=>`<option value="${m.id}" ${m.id===af.mid?'selected':''}>${esc(m.title)}</option>`).join('')}<option value="__new__">＋ 新增階段…</option></select></div>`;}
function afPickPhase(v){afSync();if(v==='__new__'){af.newPhase=true;af.mid=null;}else{af.mid=v||null;af.newPhase=false;}renderAddModal();}
function afCreatePhase(){afSync();const g=state.goals.find(x=>x.id===af.gid);const p=g&&g.projects.find(x=>x.id===af.pid);const nm=(af.newPhaseName||'').trim();if(!p||!nm){toast('請輸入階段名稱');return;}const m={id:uid(),title:nm,due:'',estimate:60,done:false,remind:'none'};p.milestones.push(m);af.mid=m.id;af.newPhase=false;af.newPhaseName='';const _g=goalForRef(p.id);logEvent('milestone_created',{goalId:_g&&_g.id,refId:m.id,title:m.title});renderAddModal();}

function durLabel(n){n=+n||0;if(n<60)return n+' 分鐘';const h=Math.floor(n/60),m=n%60;return h+' 小時'+(m?' '+m+' 分鐘':'');}

function afToCustom(){afSync();af.custom=true;if(af.freqIdx===0){af.cfreq='day';af.interval=1;}else if(af.freqIdx===1){af.cfreq='week';af.interval=1;af.wdays=[af.condIdx];}else if(af.freqIdx===2){af.cfreq='week';af.interval=2;af.wdays=[af.condIdx];}else{af.cfreq='month';af.interval=1;af.mdays=[af.condIdx+1];}renderAddModal();}

function afTogWd(i){afSync();const a=af.wdays,k=a.indexOf(i);if(k>=0){if(a.length>1)a.splice(k,1);}else a.push(i);renderAddModal();}
function afTogMd(d){afSync();const a=af.mdays,k=a.indexOf(d);if(k>=0){if(a.length>1)a.splice(k,1);}else a.push(d);renderAddModal();}

function customCadence(){let s='';if(af.cfreq==='day')s=af.interval>1?('每 '+af.interval+' 日'):'每日';else if(af.cfreq==='week'){const days=af.wdays.slice().sort((a,b)=>a-b).map(i=>WD[i]).join('、');s=(af.interval>1?('每 '+af.interval+' 週'):'每週')+(days?' '+days:'');}else{const days=af.mdays.slice().sort((a,b)=>a-b).join('、');s=(af.interval>1?('每 '+af.interval+' 月'):'每月')+(days?' '+days+' 號':'');}if(af.end==='times')s+=' · 共'+af.times+'次';else if(af.end==='date'&&af.endDue)s+=' · 到'+(af.endDue.m+1)+'/'+af.endDue.d;return s;}
function simpleCadence(){let cad=FREQ[af.freqIdx];if(af.freqIdx===1||af.freqIdx===2)cad+=' '+WD[af.condIdx];else if(af.freqIdx===3)cad+=' '+(af.condIdx+1)+' 號';return cad;}
function customPanel(){const seg=`<div class="seg"><button class="${af.cfreq==='day'?'on':''}" onclick="afSetCfreq('day')">每日</button><button class="${af.cfreq==='week'?'on':''}" onclick="afSetCfreq('week')">每週</button><button class="${af.cfreq==='month'?'on':''}" onclick="afSetCfreq('month')">每月</button></div>`;const unit=af.cfreq==='day'?'日':(af.cfreq==='week'?'週':'月');const step=`<div class="flabel">間隔</div><div class="stepper"><span class="unit">每</span><button onclick="afStep(-1)">−</button><span class="val">${af.interval}</span><button onclick="afStep(1)">＋</button><span class="unit">${unit}</span></div>`;let cond='';if(af.cfreq==='week'){cond=`<div class="flabel">星幾（可多選）</div><div class="wchips">${WD.map((w,i)=>`<div class="wchip ${af.wdays.includes(i)?'on':''}" onclick="afTogWd(${i})">${w}</div>`).join('')}</div>`;}else if(af.cfreq==='month'){let cells='';for(let d=1;d<=31;d++)cells+=`<div class="mcell ${af.mdays.includes(d)?'on':''}" onclick="afTogMd(${d})">${d}</div>`;cond=`<div class="flabel">每月幾號（可多選）</div><div class="mgrid">${cells}</div>`;}const endseg=`<div class="flabel">結束</div><div class="seg"><button class="${af.end==='none'?'on':''}" onclick="afSetEnd('none')">不結束</button><button class="${af.end==='times'?'on':''}" onclick="afSetEnd('times')">指定次數</button><button class="${af.end==='date'?'on':''}" onclick="afSetEnd('date')">到日期</button></div>`;let endextra='';if(af.end==='times')endextra=`<div class="stepper"><button onclick="afStepTimes(-1)">−</button><span class="val">${af.times}</span><button onclick="afStepTimes(1)">＋</button><span class="unit">次</span></div>`;else if(af.end==='date')endextra=`<button type="button" class="datefield" onclick="afToggleEnd()"><span class="${af.endDue?'':'ph'}">${af.endDue?((af.endDue.m+1)+'月'+af.endDue.d+'日'):'選擇結束日期'}</span><span>${af.showEnd?'▴':'▾'}</span></button>${af.showEnd?afMiniCal2():''}`;return seg+step+cond+endseg+endextra+`<div class="note">預覽：🔁 ${esc(customCadence())}</div>`;}

function settingsAvailabilityHTML(){const a=ensureAvailability(),days=['日','一','二','三','四','五','六'],open=state.settingsAvailDay;return `<div class="settingssection settingsgroup">${days.map((name,i)=>{const x=a[i],isOpen=+open===i,label=x.enabled===false?'休息日':x.start+' — '+x.end;return `<div class="availday"><button class="availdayhead" aria-expanded="${isOpen}" onclick="settingsToggleAvailDay(${i})"><b>週${name}</b><span>${label}</span><i>${isOpen?'⌃':'⌄'}</i></button>${isOpen?settingsAvailDayBody(i,x):''}</div>`;}).join('')}</div>`;}
function settingsToggleAvailDay(i){state.settingsAvailDay=+state.settingsAvailDay===i?null:i;SETTINGS_TIME_PICKER=null;render();}
function settingsAvailDayBody(i,x){const picker=SETTINGS_TIME_PICKER&&SETTINGS_TIME_PICKER.kind==='availability'&&SETTINGS_TIME_PICKER.day===i?SETTINGS_TIME_PICKER:null;return `<div class="availdaybody"><button class="availenable" onclick="setAvailEnabled(${i})"><span>${x.enabled===false?'休息日':'可安排'}</span><span class="availswitch ${x.enabled===false?'':'on'}"><i></i></span></button>${x.enabled===false?'':`<div class="settingstimegrid"><button class="settingstimebtn ${picker&&picker.edge==='start'?'on':''}" aria-label="週${['日','一','二','三','四','五','六'][i]}開始時間 ${x.start}" onclick="settingsOpenAvailTime(${i},'start')"><span>開始</span><b class="settings-time-start">${x.start}</b></button><button class="settingstimebtn ${picker&&picker.edge==='end'?'on':''}" aria-label="週${['日','一','二','三','四','五','六'][i]}結束時間 ${x.end}" onclick="settingsOpenAvailTime(${i},'end')"><span>結束</span><b class="settings-time-end">${x.end}</b></button></div>${picker?settingsTimeWheelHTML('Availability',picker.edge==='start'?x.start:x.end):''}`}</div>`;}
function settingsOpenAvailTime(day,edge){SETTINGS_TIME_PICKER=SETTINGS_TIME_PICKER&&SETTINGS_TIME_PICKER.kind==='availability'&&SETTINGS_TIME_PICKER.day===day&&SETTINGS_TIME_PICKER.edge===edge?null:{kind:'availability',day,edge};render();}
function settingsTimeWheelHTML(id,value){return `<div class="settingswheel"><div class="wheelwrap"><div class="wheelband"></div><div class="wcol">${wheelHTML('settings'+id+'Hour',sheetHours(),+value.slice(0,2))}</div><div class="wcol">${wheelHTML('settings'+id+'Minute',sheetMinutes(),sheetMinuteIndex(value))}</div></div></div>`;}
function settingsSetAvailClock(part,idx){const q=SETTINGS_TIME_PICKER;if(!q||q.kind!=='availability')return;const a=ensureAvailability()[q.day],source=a[q.edge],bits=source.split(':');if(part==='hour')bits[0]=pad2(idx);else bits[1]=pad2(idx*5);let next=bits.join(':');if(q.edge==='start'){const duration=Math.max(15,minutesOf(a.end)-minutesOf(a.start));a.start=next;if(minutesOf(a.start)+duration>1439)a.start=clock24(1439-duration);a.end=clock24(minutesOf(a.start)+duration);}else{if(minutesOf(next)<=minutesOf(a.start))next=clock24(Math.min(1439,minutesOf(a.start)+15));a.end=next;}document.querySelectorAll('.settings-time-start').forEach(x=>x.textContent=a.start);document.querySelectorAll('.settings-time-end').forEach(x=>x.textContent=a.end);persistSettingsState();}
function settingsFocusHTML(){const p=ensureSchedulePrefs();return `<div class="settingssection settingsgroup">${settingsChoiceRow('maxFocus','每日最大專注',p.maxFocus,[120,180,240,300,360,480])}${settingsChoiceRow('maxSession','單次專注時段上限',p.maxSession,[30,60,90,120,180,240])}${settingsChoiceRow('breakMinutes','專注時段之間休息',p.breakMinutes,[0,10,15,20,30,45])}</div>`;}
function settingsChoiceRow(key,title,current,values){const open=state.settingsChoice===key,label=key==='breakMinutes'&&!current?'不需要':durLabel(current);return `<div><button class="settingsrow" aria-expanded="${open}" onclick="settingsToggleChoice('${key}')"><span><b>${title}</b></span><strong>${label} ${open?'⌃':'⌄'}</strong></button>${open?`<div class="settingschoice">${values.map(v=>`<button class="${+current===v?'on':''}" onclick="settingsPickChoice('${key}',${v})"><span>${key==='breakMinutes'&&!v?'不需要':durLabel(v)}</span><b>${+current===v?'✓':''}</b></button>`).join('')}</div>`:''}</div>`;}
function settingsToggleChoice(key){state.settingsChoice=state.settingsChoice===key?null:key;render();}
function settingsPickChoice(key,value){state.settingsChoice=null;setSchedulePref(key,value);}
function settingsSetReview(v){SETTINGS_TIME_PICKER=null;setReview(v);}
function settingsReviewHTML(){const mode=state.settings.review||'both';return `<div class="settingssection settingsgroup"><div class="settingsrow"><span><b>每日回顧</b></span><strong>${{off:'關閉',morning:'早上',evening:'晚上',both:'早晚'}[mode]}</strong></div>${settingsSeg([{v:'off',l:'關閉'},{v:'morning',l:'早上'},{v:'evening',l:'晚上'},{v:'both',l:'早晚'}],mode,'settingsSetReview')}${['morning','both'].includes(mode)?settingsReviewTimeRow('am','早上回顧',state.settings.reviewAM||'08:00'):''}${['evening','both'].includes(mode)?settingsReviewTimeRow('pm','晚上回顧',state.settings.reviewPM||'21:00'):''}<div class="settingsrow"><span><b>每週自動提示</b></span><strong>${state.settings.reviewPopup?'開':'關'}</strong></div>${settingsSeg([{v:'on',l:'開'},{v:'off',l:'關'}],state.settings.reviewPopup?'on':'off','setReviewPopup')}</div>`;}
function settingsReviewTimeRow(edge,title,value){const on=SETTINGS_TIME_PICKER&&SETTINGS_TIME_PICKER.kind==='review'&&SETTINGS_TIME_PICKER.edge===edge,id=edge==='am'?'ReviewAM':'ReviewPM';return `<div><button class="settingsrow" aria-expanded="${!!on}" aria-label="${title}時間 ${value}" onclick="settingsOpenReviewTime('${edge}')"><span><b>${title}</b></span><strong class="settings-review-${edge}">${value} ${on?'⌃':'⌄'}</strong></button>${on?settingsTimeWheelHTML(id,value):''}</div>`;}
function settingsOpenReviewTime(edge){SETTINGS_TIME_PICKER=SETTINGS_TIME_PICKER&&SETTINGS_TIME_PICKER.kind==='review'&&SETTINGS_TIME_PICKER.edge===edge?null:{kind:'review',edge};render();}
function settingsSetReviewClock(part,idx){const q=SETTINGS_TIME_PICKER;if(!q||q.kind!=='review')return;const key=q.edge==='am'?'reviewAM':'reviewPM',source=state.settings[key]||(q.edge==='am'?'08:00':'21:00'),bits=source.split(':');if(part==='hour')bits[0]=pad2(idx);else bits[1]=pad2(idx*5);state.settings[key]=bits.join(':');const el=document.querySelector('.settings-review-'+q.edge);if(el)el.textContent=state.settings[key]+' ⌃';persistSettingsState();}
function settingsDisplayHTML(){return `<div class="settingssection settingsgroup"><div class="settingsrow"><span><b>今日最多顯示</b></span><strong>${state.settings.todayLimit}</strong></div>${settingsSeg([{v:5,l:'5'},{v:10,l:'10'},{v:20,l:'20'}],state.settings.todayLimit,'setLimit')}<div class="settingsrow"><span><b>即將到期範圍</b></span><strong>${state.settings.upcomingDays?state.settings.upcomingDays+' 天':'全部'}</strong></div>${settingsSeg([{v:7,l:'1週內'},{v:14,l:'2週內'},{v:0,l:'全部'}],state.settings.upcomingDays,'setUpcoming')}<div class="settingsrow"><span><b>隱藏已完成項目</b></span><strong>${state.settings.hideDone?'開':'關'}</strong></div>${settingsSeg([{v:1,l:'開'},{v:0,l:'關'}],state.settings.hideDone?1:0,'setHideDone')}<div class="settingsrow"><span><b>週起始日</b></span><strong>${state.settings.weekStart==='sun'?'週日':'週一'}</strong></div>${settingsSeg([{v:'mon',l:'週一'},{v:'sun',l:'週日'}],state.settings.weekStart||'mon','setWeekStart')}</div>`;}
function settingsCalendarHTML(){const on=state.settings.showExternalCalendar!==false,n=ensureExternalEvents().length;return `<div class="settingssection settingsgroup"><button class="settingsrow" onclick="setCalendarVisibility(${on?0:1})"><span><b>顯示外部忙碌時段</b></span><span class="availswitch ${on?'on':''}"><i></i></span></button><div class="settingsrow"><span><b>已同步活動</b></span><strong>${n} 項</strong></div></div>`;}
function settingsActivityBodyHTML(){const a=(state.events||[]).slice().sort((x,y)=>eventAt(y.at)-eventAt(x.at));return `<div class="settingsactivityopen historylist">${a.slice(0,40).map(e=>{const d=eventAt(e.at);return `<div class="histrow"><i></i><div><b>${esc(eventLabel(e))}${e.title?' · '+esc(e.title):''}</b><span>${d.getMonth()+1}/${d.getDate()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}</span></div></div>`;}).join('')||'<div class="empty">未有活動紀錄</div>'}</div>`;}
function settingsDataHTML(){return `${STORAGE_ERROR?`<div class="storagewarning" role="alert">${esc(STORAGE_ERROR)}</div>`:''}<div class="settingsdata card flatdata"><div class="setrow"><div class="sl"><div class="sn">匯出備份</div><div class="sd">下載完整 JSON 資料</div></div><button class="expbtn" onclick="exportData()">匯出</button></div><div class="setrow"><div class="sl"><div class="sn">匯入備份</div><div class="sd">還原先前匯出的資料</div></div><label class="expbtn impbtn">匯入<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label></div><div id="dataStatus" class="datastatus" role="status" aria-live="polite"></div></div>`;}
function initSettingsControls(){const q=SETTINGS_TIME_PICKER;if(!q)return;let id,value;if(q.kind==='availability'){const a=ensureAvailability()[q.day];id='Availability';value=a[q.edge];}else{id=q.edge==='am'?'ReviewAM':'ReviewPM';value=state.settings[q.edge==='am'?'reviewAM':'reviewPM']||(q.edge==='am'?'08:00':'21:00');}initWheel('settings'+id+'Hour',24,+value.slice(0,2),i=>q.kind==='availability'?settingsSetAvailClock('hour',i):settingsSetReviewClock('hour',i));initWheel('settings'+id+'Minute',12,sheetMinuteIndex(value),i=>q.kind==='availability'?settingsSetAvailClock('minute',i):settingsSetReviewClock('minute',i));}
function setLimit(v){state.settings.todayLimit=+v;render();}
function setUpcoming(v){state.settings.upcomingDays=+v;render();}
function setLead(v){state.settings.remindLead=+v;render();}
function setHideDone(v){state.settings.hideDone=!!+v;render();}
function setWeekStart(v){state.settings.weekStart=v;render();}
function setReview(v){state.settings.review=v;render();}
function setReviewAM(v){state.settings.reviewAM=v;save();}
function setReviewPM(v){state.settings.reviewPM=v;save();}
function save(){return persistState();}
function setDataStatus(kind,msg){const el=document.getElementById('dataStatus');if(el){el.className='datastatus '+kind;el.textContent=msg;}}
function validateImportData(p){if(!p||typeof p!=='object'||Array.isArray(p))throw new Error('備份內容不是有效資料');if(Number.isFinite(+p.schemaVersion)&&+p.schemaVersion>CURRENT_SCHEMA)throw new Error('備份來自較新版本，暫時無法安全匯入');for(const k of ['goals','sessions','timeBlocks','events','externalEvents','blockExceptions'])if(p[k]!==undefined&&!Array.isArray(p[k]))throw new Error(k+' 格式不正確');for(const k of ['settings','dailyPlans','garden'])if(p[k]!==undefined&&(!p[k]||typeof p[k]!=='object'||Array.isArray(p[k])))throw new Error(k+' 格式不正確');if(!Array.isArray(p.goals))throw new Error('備份缺少目標資料');p.goals.forEach((g,i)=>{if(!g||typeof g!=='object'||Array.isArray(g))throw new Error('第 '+(i+1)+' 個目標格式不正確');if(typeof g.title!=='string')throw new Error('第 '+(i+1)+' 個目標缺少名稱');for(const k of ['projects','tasks','routines'])if(g[k]!==undefined&&!Array.isArray(g[k]))throw new Error('目標 '+g.title+' 的 '+k+' 格式不正確');(g.projects||[]).forEach((x,j)=>{if(!x||typeof x!=='object'||typeof x.title!=='string')throw new Error('專案資料格式不正確');if(x.milestones!==undefined&&!Array.isArray(x.milestones))throw new Error('專案 '+x.title+' 的階段格式不正確');});});return JSON.parse(JSON.stringify(p));}
function applyImportedState(raw){const p=validateImportData(raw),before=JSON.stringify(state);captureUndo('匯入備份');try{for(const k in state)delete state[k];Object.assign(state,p);runMigrations();ensureAvailability();ensureSchedulePrefs();ensurePhase2();ensureExternalEvents();ensureDailyPlans();if(!persistState())throw new Error('本機儲存空間不足，未能完成匯入');return true;}catch(e){const old=JSON.parse(before);for(const k in state)delete state[k];Object.assign(state,old);persistState();throw e;}}
let PENDING_IMPORT=null;
function importData(ev){const f=ev.target.files&&ev.target.files[0];if(!f)return;if(f.size>5*1024*1024){setDataStatus('error','匯入失敗：檔案超過 5 MB。');ev.target.value='';return;}PENDING_IMPORT={file:f,input:ev.target};document.getElementById('modalRoot').innerHTML=`<div class="mask"><div class="modal"><h3>匯入備份？</h3><div class="note">匯入會取代目前資料。系統會先保留可復原快照；檔案驗證失敗時不會改動現有內容。</div><div class="mbtns"><button class="cancel" onclick="cancelImportData()">取消</button><button class="danger" onclick="confirmImportData()">取代並匯入</button></div></div></div>`;}
function cancelImportData(){if(PENDING_IMPORT&&PENDING_IMPORT.input)PENDING_IMPORT.input.value='';PENDING_IMPORT=null;closeModal();}
function confirmImportData(){const pending=PENDING_IMPORT;PENDING_IMPORT=null;if(!pending)return;closeModal();setDataStatus('busy','正在驗證及讀取備份…');const rd=new FileReader();rd.onload=function(){try{applyImportedState(JSON.parse(rd.result));render();setDataStatus('success','備份已成功匯入並保存。');toast('備份已成功匯入');}catch(e){render();setDataStatus('error','匯入失敗：'+e.message);}finally{if(pending.input)pending.input.value='';}};rd.onerror=function(){setDataStatus('error','匯入失敗：無法讀取檔案。');if(pending.input)pending.input.value='';};rd.readAsText(pending.file);}

function exportData(){try{const j=JSON.stringify(state,null,2);const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(j);a.download='goaltracker-backup.json';document.body.appendChild(a);a.click();a.remove();toast('備份已匯出');}catch(e){setDataStatus('error','匯出失敗：'+e.message);}}

try{const _s=localStorage.getItem('ght_state_blank');if(_s){const _p=JSON.parse(_s);if(_p&&typeof _p==='object')Object.assign(state,_p);}}catch(_){}
runMigrations();migrateDates();if(state.tlView==='cal'||state.tlView==='linear')state.tlView='week';state.sessions=state.sessions||[];state.sessions.forEach(x=>{if(x.done===undefined)x.done=false;if(x.doneAt===undefined)x.doneAt=null;});ensureAvailability();ensureSchedulePrefs();ensurePhase2();state.blockExceptions=state.blockExceptions||[];ensureExternalEvents();state.timeBlocks=state.timeBlocks||[];
state.garden=state.garden||{};if(!state.garden.owned)state.garden.owned=[];if(!state.garden.placed)state.garden.placed={};if(!state.garden.collection)state.garden.collection=[];if(state.gardenTab===undefined)state.gardenTab='garden';if(state.gardenNight===undefined)state.gardenNight=false;state.garden.preview='';if(state.settings.reviewPopup===undefined)state.settings.reviewPopup=false;state.todayPins=state.todayPins||[];ensureDailyPlans();state.goals.forEach(g=>g.routines.forEach(r=>{habitDates(r);r.wk=hDoneWk(r);r.streak=habitStreak(r);}));
const modalRootEl=document.getElementById('modalRoot');document.addEventListener('pointerdown',e=>{if(!modalRootEl.firstElementChild){const x=e.target&&e.target.closest&&e.target.closest('button,[href],[tabindex],input,select,textarea');if(x)LAST_MODAL_TRIGGER=x;}},true);new MutationObserver(()=>setupModalA11y()).observe(modalRootEl,{childList:true,subtree:true});document.addEventListener('keydown',trapModalKey);
render();
maybeReviewPopup();
</script>
</body>
</html>
